name: Bug report
description: 报告可重复的缺陷或回归
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。安全漏洞请不要使用公开 Issue，请改用私密安全报告。
  - type: textarea
    id: summary
    attributes:
      label: 问题摘要
      description: 简洁说明发生了什么，以及它为什么是缺陷。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现步骤
      description: 列出命令、输入和最小示例项目；不要附带秘密或私有业务数据。
      placeholder: |
        1. 运行 ...
        2. 打开 ...
        3. 观察到 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交
      placeholder: 0.1.0 或完整提交 SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、Node.js/npm 版本和相关命令。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏日志
      description: 删除 token、Cookie、用户名、绝对路径和私有项目内容后再粘贴。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除秘密、凭据、个人绝对路径和私有业务数据。
          required: true
